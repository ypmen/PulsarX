data:
  path: './test.txt' #data with epoch,F0,F0_err[,F1,F1_err]
  fit_F1: FALSE
  fit_F2: FALSE

plot:
  plot_only: FALSE #plot the fitting only without running multinest
  mean_anomaly: TRUE #x axis mean anomaly or time

parameter_range:
  F0_min: 99.9
  F0_max: 100.1
  A1_min: 1.
  A1_max: 100.
  PB_min: 0.9
  PB_max: 1.1
  EPS1_min: -1.
  EPS1_max: 1.
  EPS2_min: -1.
  EPS2_max: 1.
  EFAC: False

multinest:
  n_live_points: 1000
  evidence_tolerance: 0.1
  sampling_efficiency: 0.1
  out_dir: 'out/'
  rootname: 'test'
